# AutoLabel 2D — taxonomy, model và ngưỡng QA Agent.
# Mọi con số chỉnh ở đây, không sửa trong code (PRD: taxonomy không hardcode).

camera: CAM_FRONT
# Sweep camera 12Hz quanh keyframe dùng cho kiểm tra thời gian (t-2, t-1, t+1, t+2)
sweep_offsets: [-2, -1, 1, 2]

detection:
  # Chạy 1 hoặc nhiều model; nhiều model thì được fuse và sinh thêm CLASS_CONFLICT giữa các model
  detectors: [yolo_world]
  # Ngưỡng thấp để ưu tiên recall: box thừa xoá rẻ, box thiếu phải vẽ tay nên đắt
  score_threshold: 0.10
  fusion_iou: 0.55
  yolo_world:
    weights: yolov8l-worldv2.pt
    imgsz: 1280
  grounding_dino:
    model_id: IDEA-Research/grounding-dino-tiny
    box_threshold: 0.20
    text_threshold: 0.20
  florence2:
    model_id: microsoft/Florence-2-base
    # Florence-2 không trả confidence; gán một điểm cố định để risk scoring vẫn chạy
    default_score: 0.5

# Lớp nhãn: prompt cho model open-vocab + khoảng hợp lý dùng cho check LiDAR/hình học
#   height_m  : chiều cao thật (m) hợp lý của lớp
#   aspect_wh : tỉ lệ rộng/cao của box 2D hợp lý
classes:
  car:
    prompts: [car, van, suv]
    height_m: [1.2, 2.4]
    aspect_wh: [0.5, 5.0]
    color: "#3b82f6"
  truck:
    prompts: [truck, pickup truck]
    height_m: [1.5, 4.5]
    aspect_wh: [0.4, 5.5]
    color: "#8b5cf6"
  bus:
    prompts: [bus]
    height_m: [2.4, 4.6]
    aspect_wh: [0.4, 6.0]
    color: "#a855f7"
  trailer:
    prompts: [trailer]
    height_m: [1.2, 4.5]
    aspect_wh: [0.4, 7.0]
    color: "#6366f1"
  construction_vehicle:
    prompts: [excavator, construction vehicle, bulldozer]
    height_m: [1.8, 5.5]
    aspect_wh: [0.4, 5.0]
    color: "#f97316"
  pedestrian:
    prompts: [person, pedestrian]
    height_m: [0.9, 2.2]
    aspect_wh: [0.12, 1.1]
    color: "#ef4444"
  bicycle:
    prompts: [bicycle]
    height_m: [0.6, 2.2]
    aspect_wh: [0.3, 2.8]
    color: "#14b8a6"
  motorcycle:
    prompts: [motorcycle, scooter]
    height_m: [0.8, 2.2]
    aspect_wh: [0.3, 2.8]
    color: "#06b6d4"
  traffic_cone:
    prompts: [traffic cone]
    height_m: [0.3, 1.2]
    aspect_wh: [0.2, 1.4]
    color: "#f59e0b"
  barrier:
    prompts: [road barrier, concrete barrier]
    height_m: [0.4, 1.7]
    aspect_wh: [0.3, 14.0]
    color: "#eab308"

# Ánh xạ category nuScenes -> lớp nội bộ (dùng để tạo GT 2D cho đánh giá)
gt_category_map:
  vehicle.car: car
  vehicle.truck: truck
  vehicle.bus.bendy: bus
  vehicle.bus.rigid: bus
  vehicle.trailer: trailer
  vehicle.construction: construction_vehicle
  human.pedestrian.adult: pedestrian
  human.pedestrian.child: pedestrian
  human.pedestrian.construction_worker: pedestrian
  human.pedestrian.police_officer: pedestrian
  vehicle.bicycle: bicycle
  vehicle.motorcycle: motorcycle
  movable_object.trafficcone: traffic_cone
  movable_object.barrier: barrier

qa:
  confidence:
    low_threshold: 0.35
    # Cùng vị trí có lớp khác với score >= ratio * score lớp chính -> CLASS_CONFLICT
    class_conflict_ratio: 0.6
  lidar:
    # k: số điểm LiDAR tối thiểu trong box. Chỉ đòi với box đủ cao (object gần), vì LiDAR 32 tia
    # phủ thưa ở xa. Đo trên 1087 box GT (135 keyframe): box cao 40-60px có 41% object thật < 5 điểm,
    # còn box >= 60px chỉ ~2% object thật < 3 điểm -> chọn k=3, cao >= 60px.
    min_points: 3
    min_box_height_px: 60
    min_depth_m: 1.0
    max_depth_m: 45.0
    # Chiều cao ước lượng ngoài [lo * a, hi * b] của lớp -> SIZE_DEPTH_MISMATCH
    size_tolerance: [0.5, 1.5]
  temporal:
    match_iou: 0.3
    # Box ở keyframe phải xuất hiện lại ở ít nhất bấy nhiêu sweep lân cận, nếu không -> FLICKER
    min_support: 2
    # Track có ở sweep trước + sau với score >= ngưỡng này mới được đề xuất RECOVERED_BY_TRACK
    recover_min_score: 0.35
  geometry:
    max_area_ratio: 0.35
    border_margin_px: 4
  risk:
    # risk = w1 (1 - score) + w2 lidar + w3 temporal + w4 geometric
    weights:
      detection: 0.35
      lidar: 0.30
      temporal: 0.20
      geometric: 0.15
    class_conflict_penalty: 0.30
    # Object có bất kỳ issue nào không được rơi vào nhóm low (không bị duyệt theo lô)
    issue_floor: 0.30
    levels:
      medium: 0.30
      high: 0.60
