# AutoLabel 2D — taxonomy, model và ngưỡng QA Agent.
# Mọi con số chỉnh ở đây, không sửa trong code (PRD: taxonomy không hardcode).

camera: CAM_FRONT
# Sweep camera 12Hz quanh keyframe dùng cho kiểm tra thời gian (t-2, t-1, t+1, t+2)
sweep_offsets: [-2, -1, 1, 2]

detection:
  # Chạy 1 hoặc nhiều model; nhiều model thì được fuse và sinh thêm CLASS_CONFLICT giữa các model (fusion chỉ tính
  # phiếu của model nhận được lớp đó). Mặc định YOLOE-26 (open-vocab, có mask); so sánh với YOLO-World / YOLO26:
  # eval/compare_detectors.ipynb, eval/results/detector_comparison.md. Bản YOLOE-26-L riêng (text encoder từ file):
  # [yoloe26], tải weights bằng python scripts/download_weights.py. Chọn khác: [yolo26, yoloe], [yolo_world], ...
  detectors: [yoloe]
  # Ngưỡng thấp để ưu tiên recall: box thừa xoá rẻ, box thiếu phải vẽ tay nên đắt
  score_threshold: 0.10
  # Ngưỡng giữ box sau khi gộp (trước QA Agent). Đổi không phải detect lại, chỉ cần `run --overwrite`.
  # 0.30 chọn bằng eval/precision_tuning.ipynb: precision 0.34 -> 0.51, box bị gắn cờ 260 -> 88 trên 40 keyframe.
  # Tracker lan truyền vẫn dùng detection đầy đủ (từ score_threshold) ở các ảnh sweep
  min_score: 0.30
  min_score_per_class: {}
  fusion_iou: 0.55
  # Dự án có LiDAR: sau bước dự đoán 3D, box 3D của ensemble được chiếu xuống ảnh và gộp với box của detector ảnh
  # (src/services/lidar2d.py). Test 957 keyframe: mAP50 0.366 -> 0.618, precision 0.467 -> 0.671, recall 0.582 -> 0.739.
  # camera_only_scale chọn trên dev trong {1.0, 0.7, 0.5}; match_iou 0.4 trong {0.5, 0.4, 0.3} (giảm 58% cặp box trùng
  # của cùng một vật nhỏ, F1 giữ nguyên). Box chiếu là hộp bao của box 3D (bao cả phần bị che).
  lidar3d:
    enabled: true
    min_score: 0.05
    match_iou: 0.4
    camera_only_scale: 0.5
    # Box chỉ camera thấy mà trong box có <= no_lidar_max_points điểm LiDAR dùng hệ số này thay cho camera_only_scale.
    # 04/10/2026, detector fine-tune toàn mạng: 95% box loại này không khớp nhãn gốc, nên hạ mạnh hơn (x0.3 thay vì
    # x0.5); chọn trên dev. Test 6 camera (5742 ảnh): precision 0.628 -> 0.672, recall 0.818 -> 0.812, box phải sửa
    # 17348 -> 15184; so với chỉ detector ảnh: mAP50 0.560 -> 0.672, phải sửa 23432 -> 15184. eval/results/lidar2d.md.
    # null = hạ như box chỉ camera khác
    no_lidar_scale: 0.3
    no_lidar_max_points: 0
    # Hai box 3D của xe 4 bánh trở lên chồng nhau trên mặt đường >= 15% (so với box nhỏ hơn) là một xe: giữ box điểm cao
    # hơn, lớp của box bị bỏ thành lớp phụ. Sửa lỗi một xe tải dài có hai nhãn (scene-0035_023). null = tắt
    dedup_bev_overlap: 0.15
  # https://github.com/ultralytics/yolo26 — COCO 80 lớp, chỉ giữ lớp trùng prompt của taxonomy
  # Tập lớp đóng COCO: không nhận barrier / traffic_cone / trailer / construction_vehicle
  yolo26:
    weights: weights/yolo26l.pt
    imgsz: 1280
  # https://huggingface.co/openvision/yoloe26-l-seg — open-vocab, prompt lấy từ `classes` bên dưới
  yoloe26:
    weights: weights/yoloe-26l-seg.pt
    imgsz: 1280
    text_encoder: weights/mobileclip2_b.ts
  yolo_world:
    weights: yolov8l-worldv2.pt
    imgsz: 1280
  # Open-vocab thế hệ mới (YOLO26 + MobileCLIP2); so sánh: eval/compare_detectors.ipynb
  yoloe:
    # Fine-tune toàn mạng trên nuImages (10 lớp nuScenes, tools2d/README.md). Held-out nuScenes CAM_FRONT 4852 ảnh:
    # mAP50 0.266 (gốc) -> 0.305 (linear probe) -> 0.585, recall 0.478 -> 0.530 -> 0.782. Tập lớp đóng: không nhận
    # prompt chữ mới. Đổi mô hình trên UI: tab ⚙ Cài đặt > "Mô hình phát hiện 2D" (Fine-tune full / Fine-tune mini = linear probe / Original = gốc open-vocab).
    weights: weights/yoloe-26l-nuimages-full-1280.pt
    imgsz: 1280
  grounding_dino:
    model_id: IDEA-Research/grounding-dino-tiny
    box_threshold: 0.20
    text_threshold: 0.20
  florence2:
    model_id: microsoft/Florence-2-base
    # Florence-2 không trả confidence; gán một điểm cố định để risk scoring vẫn chạy
    default_score: 0.5
  # Chỉ cho video demo tổng hợp (python -m src.demo): tìm vật thể theo màu, không cần GPU
  demo:
    tolerance: 48
    min_area: 60
    confident_area: 3500

# Lớp nhãn: prompt cho model open-vocab + khoảng hợp lý dùng cho check LiDAR/hình học
#   height_m  : chiều cao thật (m) hợp lý của lớp
#   aspect_wh : tỉ lệ rộng/cao của box 2D hợp lý
classes:
  car:
    prompts: [car, van, suv]
    height_m: [1.2, 2.4]
    aspect_wh: [0.5, 5.0]
    color: "#3b82f6"
  truck:
    prompts: [truck, pickup truck]
    height_m: [1.5, 4.5]
    aspect_wh: [0.4, 5.5]
    color: "#8b5cf6"
  bus:
    prompts: [bus]
    height_m: [2.4, 4.6]
    aspect_wh: [0.4, 6.0]
    color: "#a855f7"
  trailer:
    prompts: [trailer]
    height_m: [1.2, 4.5]
    aspect_wh: [0.4, 7.0]
    color: "#6366f1"
  construction_vehicle:
    prompts: [excavator, construction vehicle, bulldozer]
    height_m: [1.8, 5.5]
    aspect_wh: [0.4, 5.0]
    color: "#f97316"
  pedestrian:
    prompts: [person, pedestrian]
    height_m: [0.9, 2.2]
    aspect_wh: [0.12, 1.1]
    color: "#ef4444"
  bicycle:
    prompts: [bicycle]
    height_m: [0.6, 2.2]
    aspect_wh: [0.3, 2.8]
    color: "#14b8a6"
  motorcycle:
    prompts: [motorcycle, scooter]
    height_m: [0.8, 2.2]
    aspect_wh: [0.3, 2.8]
    color: "#06b6d4"
  traffic_cone:
    prompts: [traffic cone]
    height_m: [0.3, 1.2]
    aspect_wh: [0.2, 1.4]
    color: "#f59e0b"
  barrier:
    prompts: [road barrier, concrete barrier]
    height_m: [0.4, 1.7]
    aspect_wh: [0.3, 14.0]
    color: "#eab308"

# Ánh xạ category nuScenes -> lớp nội bộ (dùng để tạo GT 2D cho đánh giá)
gt_category_map:
  vehicle.car: car
  vehicle.truck: truck
  vehicle.bus.bendy: bus
  vehicle.bus.rigid: bus
  vehicle.trailer: trailer
  vehicle.construction: construction_vehicle
  human.pedestrian.adult: pedestrian
  human.pedestrian.child: pedestrian
  human.pedestrian.construction_worker: pedestrian
  human.pedestrian.police_officer: pedestrian
  vehicle.bicycle: bicycle
  vehicle.motorcycle: motorcycle
  movable_object.trafficcone: traffic_cone
  movable_object.barrier: barrier

qa:
  confidence:
    # Detector fine-tune toàn mạng: box score < 0.6 sai 85% (held-out 795 keyframe), 0.9+ chỉ sai 2%
    low_threshold: 0.6
    # Cùng vị trí có lớp khác với score >= ratio * score lớp chính -> CLASS_CONFLICT
    class_conflict_ratio: 0.6
  lidar:
    # k: số điểm LiDAR tối thiểu trong box. Chỉ đòi với box đủ cao (object gần), vì LiDAR 32 tia
    # phủ thưa ở xa. Đo trên 1087 box GT (135 keyframe): box cao 40-60px có 41% object thật < 5 điểm,
    # còn box >= 60px chỉ ~2% object thật < 3 điểm -> chọn k=3, cao >= 60px.
    min_points: 3
    min_box_height_px: 60
    min_depth_m: 1.0
    max_depth_m: 45.0
    # Chiều cao ước lượng ngoài [lo * a, hi * b] của lớp -> SIZE_DEPTH_MISMATCH
    size_tolerance: [0.5, 1.5]
    # Điểm rủi ro LiDAR theo số điểm trong box. Dò trên dev 04/10/2026 (detector fine-tune toàn mạng): box 0 điểm
    # sai 93% (held-out 96%), 1-2 điểm 69%, 3-4 điểm 55%, từ 5 điểm ~20%. eval/results/qa_tuning.md
    no_points_term: 1.0      # box nhỏ (< min_box_height_px) không có điểm nào
    zero_points_issue: true  # ... và bị gắn cờ NO_LIDAR_SUPPORT (không vào nhóm duyệt theo lô)
    few_points_term: 0.4     # box nhỏ có 1..min_points-1 điểm
    sparse_points: 5         # min_points <= số điểm < sparse_points -> sparse_term
    sparse_term: 0.2
  temporal:
    match_iou: 0.3
    # Box ở keyframe phải xuất hiện lại ở ít nhất bấy nhiêu sweep lân cận, nếu không -> FLICKER
    min_support: 2
    # Track có ở sweep trước + sau với score >= ngưỡng này mới được đề xuất RECOVERED_BY_TRACK. 1.0 = chỉ box người đã
    # xác nhận / vẽ ở sweep (score 1.0). Box sweep của riêng detector không tạo đề xuất nữa: với detector fine-tune
    # toàn mạng, held-out 795 keyframe có 314 đề xuất loại này mà chỉ 7 trùng vật bị sót (trước 04/10 là 0.35)
    recover_min_score: 1.0
    # Detector thấy vật ở keyframe nhưng score dưới min_score (0.10–0.30) -> box bị bỏ. Nếu sweep trước VÀ sau đều có box
    # cùng lớp trùng vị trí (score >= ngưỡng này, kể cả box sweep dưới min_score) thì giữ lại box của detector, gắn
    # RECOVERED_BY_TRACK (nét đứt, phải xác nhận; không bao giờ vào nhóm duyệt theo lô). Ví dụ: xe đạp 0.34 ở frame
    # trước, 0.20 ở frame này, sweep 0.26 / 0.23. Box nội suy từ sweep cũng lấy box detector khi có (sát vật hơn). null = tắt
    # Tắt từ 04/10 (trước là 0.2): với detector fine-tune toàn mạng, held-out có 313 đề xuất loại này, 31 trùng vật sót
    recover_weak_min_score: null
    # Optical flow (OpenCV DIS, ~0.06 s/cặp ảnh trên CPU) dời box của sweep về thời điểm keyframe trước khi so khớp:
    # box sweep khớp keyframe đúng hơn hẳn (IoU TB ở t±2: 0.58 -> 0.83), cờ FLICKER đúng hơn nhưng bắt ít lỗi hơn:
    # held-out 20 scene (795 keyframe) lỗi lọt qua duyệt theo lô 1632 -> 2082. Không khuyên bật.
    # Xem eval/results/temporal/report.md. Chỉnh được ở tab ⚙ Cài đặt trên web.
    flow: false
    flow_scale: 0.5
    # Tính lại score keyframe theo các sweep (src/services/temporal_fusion.py):
    #   off    : score detector
    #   mean   : (score keyframe + score box ghép được ở từng sweep) / (1 + số sweep) — box loé lên một lần bị hạ
    #   linked : trung bình các lần thấy (kiểu Seq-NMS) — tăng recall, thêm box sai
    # mAP gần như không đổi. Held-out 20 scene, mean (flow tắt): box phải xem tay 1707 -> 648, box sai 2980 -> 1860,
    # lỗi còn lại sau duyệt như cũ (4197 -> 4190) nhưng vật sót 2565 -> 2791. Tắt mặc định (chọn trên dev), nhóm quyết.
    rescore: "off"
    # Ngưỡng score của box ở sweep khi làm bằng chứng cho keyframe (null = như detection.min_score). Đã thử 0.1 (kiểu
    # ByteTrack): FLICKER giảm 190 -> 120 nhưng phần lớn là cờ đúng, lỗi còn lại dev 704 -> 736, held-out 662 -> 693
    sweep_min_score: null
  geometry:
    max_area_ratio: 0.35
    border_margin_px: 4
  risk:
    # risk = w1 (1 - score) + w2 lidar + w3 temporal + w4 geometric
    # Dò lại trên dev 04/10/2026 cho detector fine-tune toàn mạng (trước: 0.35 / 0.30 / 0.20 / 0.15). Risk cũ xếp lỗi
    # không hơn gì score detector (AUC held-out 0.841 cả hai); risk mới 0.916. Điểm temporal không giúp xếp hạng nên
    # trọng số 0, cờ FLICKER vẫn giữ box ngoài nhóm low. eval/results/qa_tuning.md
    weights:
      detection: 0.60
      lidar: 0.25
      temporal: 0.0
      geometric: 0.15
    class_conflict_penalty: 0.30
    # Object có bất kỳ issue nào không được rơi vào nhóm low (không bị duyệt theo lô)
    issue_floor: 0.17
    # Ngưỡng chọn trên dev: nhóm low sai <= 5% (held-out 9%), nhóm high sai >= 95% (held-out 96%). Trước: 0.30 / 0.60
    levels:
      medium: 0.17
      high: 0.40

# QC nhãn cuối: QA Agent chỉ chấm box detector lúc pipeline chạy; phần này kiểm lại nhãn SAU khi người sửa
# (khi approve frame và trước khi xuất), kiểm file nhãn từ ngoài (Quick Check), và audit ngẫu nhiên phần duyệt theo lô.
qc:
  # Chặn approve frame khi nhãn cuối còn lỗi QC chưa sửa / chưa xác nhận
  gate_on_approve: true
  # Cạnh box ngắn hơn ngần này (px) -> INVALID_BOX. Bằng ngưỡng của thao tác sửa box (review.py). Không đặt cao hơn:
  # vật bị mép ảnh cắt chỉ còn 2-4 px là nhãn hợp lệ (đo trên GT nuScenes: 4 box như vậy ở mép phải)
  min_box_px: 2
  # Hai box cùng lớp IoU >= ngưỡng -> DUPLICATE_BOX (một vật bị gán hai lần, hay gặp sau ADD_BOX / nhận box nội suy)
  duplicate_iou: 0.7
  # Hai box khác lớp IoU >= ngưỡng -> OVERLAP_CROSS_CLASS (một vật bị gán hai lớp)
  cross_class_iou: 0.85
  # Cặp lớp được phép chồng lên nhau (người ngồi trên xe đạp / xe máy được gán riêng trong nuScenes)
  cross_class_allowed:
    - [pedestrian, bicycle]
    - [pedestrian, motorcycle]
  quick_check:
    max_file_mb: 20
    # Detection keyframe score >= ngưỡng, có mặt ở >= qa.temporal.min_support sweep, mà file không có box nào
    # khớp (IoU >= missing_match_iou, không xét lớp) -> POSSIBLY_MISSING kèm box đề xuất
    missing_min_score: 0.5
    missing_match_iou: 0.3
    # Nhãn khớp detection (IoU >= 0.5) nhưng detector gán lớp khác với score >= ngưỡng -> MODEL_DISAGREES
    disagree_min_score: 0.6
  audit:
    # Lấy mẫu ngẫu nhiên object đã duyệt theo lô (BATCH_APPROVE) cho người xem lại từng cái. Đạt khi cận trên
    # Wilson 95% của tỉ lệ lỗi <= max_error_upper (hoặc đã audit hết). n=50, 0 lỗi -> cận trên 7.1%
    object_sample_size: 50
    object_max_error_upper: 0.10
    # Lấy mẫu frame đã approve để kiểm vật bị sót (FN). n=10, 0 lỗi -> cận trên 27.8%. 0 = không bắt buộc
    frame_sample_size: 10
    frame_max_error_upper: 0.30
    confidence_z: 1.96

# Lan truyền nhãn trên video (FR-11 → FR-13): mang quyết định của người ở một keyframe đã approve
# sang các keyframe sau, bằng cách track qua mọi ảnh camera 12Hz nằm giữa (dùng detection đã cache).
propagation:
  # Ghép box dự đoán với detection ở ảnh kế tiếp (các ảnh cách nhau ~83 ms nên box dịch rất ít)
  match_iou: 0.3
  # Box người đã xoá ở keyframe chỉ được tự xoá ở frame sau khi khớp chặt và cùng lớp
  suppress_iou: 0.5
  # Tỉ trọng của detection khi cập nhật box (phần còn lại là dự đoán theo vận tốc)
  smoothing: 0.7
  velocity_smoothing: 0.5
  # Không khớp detection quá bấy nhiêu ảnh liên tiếp (~0.5 s ở 12Hz) thì dừng track
  max_coast_images: 6
  # Phần box còn nằm trong ảnh dưới tỉ lệ này (đi ra khỏi khung) thì dừng
  min_visible: 0.3
  min_box_px: 6
  # c_prop = trung bình có trọng số của 3 thành phần (thành phần nào không đo được thì bỏ và chuẩn hoá lại):
  #   agreement : IoU giữa box dự đoán và detection ở chính frame này (0 nếu detector không thấy)
  #   continuity: tỉ lệ ảnh có detection khớp kể từ keyframe gốc
  #   lidar     : số điểm LiDAR trong box so với ở keyframe gốc (tụt = bị che hoặc đi xa), chặn trên 1
  # rồi nhân hop_decay^(số keyframe đã đi qua - 1). Mô phỏng (detection rung ±4px, rơi 15%): 0.97 làm mọi
  # nhãn đúng bị gắn cờ từ keyframe thứ ~12; 0.99 thì nhãn khớp detector chỉ bị gắn cờ sau ~30 keyframe
  weights:
    agreement: 0.5
    continuity: 0.3
    lidar: 0.2
  hop_decay: 0.99
  # c_prop dưới ngưỡng này -> issue PROP_LOW_CONF (không rơi vào nhóm duyệt theo lô)
  flag_below: 0.6
  # c_prop dưới ngưỡng này -> dừng lan truyền object đó. Để thấp: object detector tạm không thấy vẫn được
  # đưa ra (kèm PROP_COASTING) cho người xem; mất dấu thật thì đã có max_coast_images cắt
  stop_below: 0.15
  # Track mà detector không thấy ở chính keyframe đích (box chỉ là dự đoán theo vận tốc) có được ghi ra không.
  # Đo bằng eval/review_simulation.ipynb (2 scene nuScenes, người duyệt mô phỏng theo GT): chỉ ~17% box loại này đúng, người phải xoá
  # phần còn lại nên lan truyền không đỡ công. Tắt thì track vẫn chạy tiếp và bắt lại vật khi detector thấy lại.
  emit_coasting: false
  # Dự đoán box ở ảnh kế tiếp bằng optical flow thay vì vận tốc không đổi (ý tưởng Deep Feature Flow ở mức box):
  #   off     : vận tốc không đổi (như trước)
  #   missing : chỉ ở ảnh chưa có detection (ảnh giữa hai keyframe mà `run` không detect)
  #   always  : mọi ảnh — held-out 20 scene (154 lần lan truyền, 1060 object, tối đa 10 keyframe): nhãn đúng
  #             2910 -> 3329 (+14%), đổi ID 265 -> 97, mất dấu -22%; tốn ~1 s mỗi lần lan truyền 10 keyframe (CPU)
  flow: always
  flow_scale: 0.5
  # Ghép track với detection: single = một lượt (như trước) | byte = hai lượt kiểu ByteTrack: box score ≥ byte_high_score
  # trước, box score thấp chỉ cho track còn thiếu với IoU ≥ byte_low_iou. Dev (cùng flow always): box lan truyền sai
  # 224 -> 203, nhãn đúng giữ nguyên (791 -> 789), tỉ lệ đúng 0.762 -> 0.779; held-out 4 scene: sai 329 -> 300
  association: byte
  byte_high_score: 0.3
  byte_low_iou: 0.5
  # OC-SORT (Cao et al., CVPR 2023): OCR = ghép thêm track đang mất theo box quan sát cuối (oc_recover_iou), sống tới
  # oc_max_lost ảnh; ORU = vận tốc theo quan sát cuối -> quan sát mới sau khi mất; OCM = ưu tiên detection cùng hướng đi.
  # Tắt: 20 scene test, box ghi ra đúng 3192 -> 3215 (+0.7%) nhưng đổi ID 76 -> 87, box sai 860 -> 868 — không lợi.
  # ORU / OCM không đổi gì đo được (flow đã dự đoán theo quan sát). eval/results/ocsort.md
  oc_recover: false
  oc_reupdate: false
  oc_momentum: 0.0
  oc_max_lost: 6
  oc_recover_iou: 0.5
  # Số keyframe tối đa đi tới trong một lần lan truyền
  max_keyframes: 20
  # Detector ở frame đích gán lớp khác lớp lan truyền với score >= ngưỡng -> PROP_CLASS_DIFFERS
  class_differs_score: 0.5

# Lan truyền box 3D đã duyệt sang keyframe sau (src/services/propagation3d.py): box về hệ toàn cục (bù chuyển động xe),
# dịch theo vận tốc mô hình dự đoán, khớp dự đoán ở keyframe sau theo khoảng cách tâm (ngưỡng theo lớp của tracker
# CenterPoint × dist_scale). Chọn trên 3 scene dev (thí nghiệm keyframe hoàn hảo, ensemble): so với chỉ bù chuyển động
# xe, nhãn đúng 3650 -> 4074, đổi ID 182 -> 106; held-out 4 scene: 3031 -> 3339, đổi ID 98 -> 36, tỉ lệ đúng 0.95.
# max_misses 2 -> 4 (thử OC-SORT, 2026-10-01): giữ track qua vật che lâu hơn. Dev: nhãn đúng 4074 -> 4126, đổi ID
# 106 -> 116; test 24 scene: 23355 -> 23731 (+1.6%), đổi ID 470 -> 543, tỉ lệ đúng 0.943 -> 0.940. Bước OCR của OC-SORT
# (nhận lại theo quan sát cuối) thêm được trên test nhưng không trên dev nên tắt; ORU / OCM không đổi gì.
propagation3d:
  motion: velocity
  dist_scale: 0.5
  max_misses: 4
  max_keyframes: 20
  oc_recover: false
  oc_reupdate: false
  oc_momentum: 0.0
  oc_max_lost: 4

# Video mp4 tải lên (chế độ Video trên UI). Frame cắt ở track_fps dùng cho tracking khi lan truyền; cứ
# track_fps/label_fps frame thì có một keyframe để gán nhãn (giống keyframe 2Hz + sweep 12Hz của nuScenes)
video:
  track_fps: 10
  label_fps: 2
  max_seconds: 120
  max_upload_mb: 500
  max_sweep_gap_s: 0.25   # frame lân cận xa hơn ngần này (s) không dùng cho check temporal

# Làm mờ mặt người + biển số trên mọi ảnh gửi tới trình duyệt và ảnh trong file xuất KITTI (FR-03).
# Biển số: detector chuyên dụng (open-image-models, trong requirements-ml.txt); mặt: YOLOE "human face" + vùng đầu
# của người đủ lớn. Thiếu thư viện thì ảnh gửi nguyên (log cảnh báo một lần). Ảnh đã làm mờ được cache ở workspace/anon/.
privacy:
  enabled: true
  plate_conf: 0.25
  plate_tiles: true
  face_prompts: [human face]
  face_conf: 0.25
  person_conf: 0.3
  min_person_px: 40
  pad: 0.2
