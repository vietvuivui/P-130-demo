<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dự án — AutoLabel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="ui-flow.css">
</head>
<body>

  <!-- Top Navigation Bar (Image 2) -->
  <header class="header">
    <div class="header-left">
      <a href="projects.html" class="logo">
        <i class="ri-box-3-fill logo-icon"></i>
        <span>AutoLabel</span>
      </a>
      <nav class="nav">
        <a href="projects.html" class="nav-item active">Dự án</a>
        <a href="frames.html" class="nav-item">Tasks &amp; Frames</a>
        <a href="export.html" class="nav-item">Xuất dữ liệu</a>
      </nav>
    </div>

    <div class="header-right">
      <div class="user-profile" onclick="window.location.href='login.html'" title="Tài khoản người dùng">
        <i class="ri-user-line avatar-icon"></i>
        <span class="user-name">Người dùng</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="page-wrap">
    <!-- Controls Toolbar (Image 2) -->
    <div class="toolbar-row">
      <div class="search-box">
        <input type="text" id="projectSearchInput" placeholder="Tìm kiếm dự án...">
        <button class="search-btn" title="Tìm kiếm">
          <i class="ri-search-line"></i>
        </button>
      </div>

      <div style="position: relative;">
        <button class="filter-btn" id="projectSortBtn" title="Sắp xếp">
          <span id="projectSortLabel">Sắp xếp: Mới nhất</span>
          <i class="ri-list-check"></i>
        </button>
        <div id="projectSortMenu" style="display: none; position: absolute; left: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--border-light); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); width: 180px; z-index: 100; padding: 4px 0;">
          <a href="javascript:void(0)" onclick="setProjectSort('newest')" style="display: block; padding: 8px 14px; font-size: 13px; color: var(--text-main); text-decoration: none;">Mới nhất</a>
          <a href="javascript:void(0)" onclick="setProjectSort('name')" style="display: block; padding: 8px 14px; font-size: 13px; color: var(--text-main); text-decoration: none;">Tên (A-Z)</a>
          <a href="javascript:void(0)" onclick="setProjectSort('frames')" style="display: block; padding: 8px 14px; font-size: 13px; color: var(--text-main); text-decoration: none;">Số lượng frame</a>
        </div>
      </div>

      <div style="position: relative;">
        <button class="filter-btn" id="projectFilterBtn" title="Lọc dự án">
          <span id="projectFilterLabel">Lọc: Tất cả</span>
          <i class="ri-filter-3-line"></i>
        </button>
        <div id="projectFilterMenu" style="display: none; position: absolute; left: 0; top: calc(100% + 4px); background: #fff; border: 1px solid var(--border-light); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); width: 180px; z-index: 100; padding: 4px 0;">
          <a href="javascript:void(0)" onclick="setProjectFilter('all')" style="display: block; padding: 8px 14px; font-size: 13px; color: var(--text-main); text-decoration: none;">Tất cả dự án</a>
          <a href="javascript:void(0)" onclick="setProjectFilter('in_progress')" style="display: block; padding: 8px 14px; font-size: 13px; color: var(--text-main); text-decoration: none;">Đang gán nhãn</a>
          <a href="javascript:void(0)" onclick="setProjectFilter('completed')" style="display: block; padding: 8px 14px; font-size: 13px; color: var(--text-main); text-decoration: none;">Đã hoàn thành</a>
        </div>
      </div>

      <button class="clear-filters" id="btnClearProjectFilters">
        Xóa bộ lọc
      </button>

      <button class="add-btn" onclick="openModal('createProjectModal')" title="Tạo dự án mới hoặc tải video">
        <i class="ri-add-line"></i>
      </button>
    </div>

    <!-- Projects Grid (Image 2) -->
    <div class="projects-grid" id="projectsGrid">
      <!-- Populated dynamically via ui-flow.js -->
    </div>

    <!-- Pagination (Image 2) -->
    <div class="pagination">
      <button class="page-arrow" title="Trang trước"><i class="ri-arrow-left-s-line"></i></button>
      <span class="page-num">1</span>
      <button class="page-arrow" title="Trang sau"><i class="ri-arrow-right-s-line"></i></button>
    </div>
  </main>

  <!-- Create Project / Upload Video Modal -->
  <div id="createProjectModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">Tạo dự án mới</div>
      <div class="modal-sub">Khởi tạo dự án gán nhãn hoặc tải lên tệp video (MP4) để AI tự động cắt frame và auto-label.</div>
      <form id="createProjectForm">
        <div class="form-item">
          <label class="form-label" for="newProjectName">Tên dự án</label>
          <input type="text" id="newProjectName" class="form-control" placeholder="Ví dụ: Dự án 4 (VF_Highway_Day02)">
        </div>

        <div class="form-item">
          <label class="form-label" for="videoFileInput">Tải lên video MP4 (tùy chọn)</label>
          <input type="file" id="videoFileInput" accept="video/mp4,video/quicktime,video/x-msvideo,video/x-matroska,video/webm,.mp4" class="form-control" style="padding: 4px;">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-default" onclick="closeModal('createProjectModal')">Hủy</button>
          <button type="submit" class="btn-primary">Tạo dự án</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="ui-flow.js"></script>
</body>
</html>
