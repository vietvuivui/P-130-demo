<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xuất dữ liệu — AutoLabel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="ui-flow.css?v=3d36">
</head>

<body>

  <!-- Top Navigation Bar -->
  <header class="header">
    <div class="header-left">
      <a href="projects.html" class="logo">
        <i class="ri-box-3-fill logo-icon"></i>
        <span>AutoLabel</span>
      </a>
      <nav class="nav">
        <a href="projects.html" class="nav-item">Dự án</a>
        <a href="frames.html" class="nav-item">Tasks &amp; Frames</a>
        <a href="export.html" class="nav-item active">Xuất dữ liệu</a>
      </nav>
    </div>

    <div class="header-right">
      <div class="user-profile" onclick="window.location.href='login.html'" title="Tài khoản người dùng">
        <i class="ri-user-line avatar-icon"></i>
        <span class="user-name">Người dùng</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="page-wrap" style="max-width: 800px;">
    <div class="project-header-card" style="margin-top: 12px;">
      <div class="modal-header" style="font-size: 18px; margin-bottom: 4px;">Xuất tập dữ liệu gán nhãn</div>
      <div class="modal-sub">Xuất các frame và bounding box đã qua kiểm duyệt sang định dạng chuẩn COCO, KITTI, YOLO,
        nuScenes.</div>

      <div class="form-item">
        <label class="form-label">Định dạng xuất dữ liệu</label>
        <select id="exportFormatSelect" class="form-control">
          <option value="KITTI">KITTI 3D / 2D bounding boxes</option>
          <option value="COCO" selected>COCO 1.0</option>
          <option value="nuScenes">nuScenes JSON format</option>
          <option value="YOLO">YOLOv8 txt annotations</option>
        </select>
      </div>

      <div class="form-item">
        <label class="form-label">Bao gồm frame chưa duyệt</label>
        <select class="form-control">
          <option value="no" selected>Không</option>
          <option value="yes">Có</option>
        </select>
      </div>

      <div style="margin-top: 24px; display: flex; gap: 12px;">
        <button id="btnDoExport" class="btn-primary" style="padding: 0 20px; height: 36px;">
          <i class="ri-download-cloud-2-line"></i>
          <span>Xuất dữ liệu</span>
        </button>
        <a href="projects.html" class="btn-default" style="display: inline-flex; align-items: center; height: 36px;">
          Quay lại Dự án
        </a>
      </div>
    </div>

    <!-- Export Result Card -->
    <div id="exportSuccessCard" class="project-header-card" style="display: none; margin-top: 20px;">
      <div style="display: flex; align-items: center; gap: 8px; color: #52c41a; font-weight: 600; margin-bottom: 8px;">
        <i class="ri-checkbox-circle-fill" style="font-size: 18px;"></i>
        <span>Tập dữ liệu đã được khởi tạo thành công</span>
      </div>
      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
        Mã xuất: <strong id="exportIdDisplay" style="color: var(--text);">—</strong> · Số frame: <span
          id="exportFramesCount">0</span> · Số đối tượng: <span id="exportObjectsCount">0</span>
      </div>
      <div id="exportFileList"></div>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>
  <script src="dialog.js?v=3d36"></script>
  <script src="ui-flow.js?v=3d36"></script>
</body>

</html>
